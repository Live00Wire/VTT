<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uno | Tabletop Nexus</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif; background: var(--bg-gradient); color: var(--text-main);
            margin: 0; padding: 0; min-height: 100vh; overflow: hidden; 
        }

        #pregame-lobby {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient); z-index: 50; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center;
        }
        
        .player-list-box {
            background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 16px;
            padding: 2rem; width: 350px; margin-bottom: 2rem; text-align: left;
        }
        
        .lobby-player-row {
            padding: 1rem 0; border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 1.2rem; display: flex; align-items: center; gap: 10px;
        }
        
        .settings-panel {
            background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 1.5rem; text-align: left; margin-bottom: 2rem;
        }
        
        .settings-panel label { display: block; margin-bottom: 10px; cursor: pointer; font-size: 1.1rem; }
        .settings-panel input { transform: scale(1.3); margin-right: 10px; accent-color: var(--accent); }

        .arena {
            display: none; 
            grid-template-columns: 200px 1fr 200px; grid-template-rows: 150px 1fr 200px;
            height: 100vh; width: 100vw; box-sizing: border-box; padding: 1rem;
        }

        .pos-top { grid-column: 2; grid-row: 1; display: flex; justify-content: center; align-items: flex-start; }
        .pos-left { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
        .pos-right { grid-column: 3; grid-row: 2; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; }
        .pos-bottom { grid-column: 2; grid-row: 3; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative;}
        .pos-center { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }

        .opp-plate {
            background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); border-radius: 12px;
            padding: 1rem; text-align: center; min-width: 120px; transition: all 0.3s;
        }
        
        .opp-plate.active-turn { border-color: var(--accent); box-shadow: 0 0 15px var(--accent); transform: scale(1.05); }
        .opp-cards { font-size: 1.5rem; font-weight: 800; margin-top: 5px; }

        #game-header { position: absolute; top: 1rem; left: 1rem; z-index: 10; }
        #turn-timer { font-size: 1.5rem; font-weight: 800; color: #eab308; margin-top: 10px;}

        .card-cluster { display: flex; gap: 1rem; position: relative; z-index: 5; }
        
        .uno-card {
            width: 70px; height: 100px; border-radius: 8px; border: 3px solid white;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-weight: 800; color: white;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.4); box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer; transition: transform 0.2s; user-select: none; flex-shrink: 0; position: relative;
        }
        
        .uno-card:hover { transform: translateY(-15px); z-index: 10; }
        .uno-card.disabled-card { opacity: 0.35 !important; cursor: not-allowed !important; pointer-events: none !important; filter: grayscale(30%) !important; }
        
        .bg-red { background-color: #ef4444; } .bg-blue { background-color: #3b82f6; }
        .bg-green { background-color: #10b981; } .bg-yellow { background-color: #eab308; }
        .bg-deck { background-color: #1e293b; color: var(--accent); font-size: 1rem; border-color: var(--card-border); }
        .bg-wild { background: conic-gradient(from 45deg, #ef4444 25%, #eab308 25% 50%, #10b981 50% 75%, #3b82f6 75%); }

        @keyframes slideFromDeck { 0% { opacity: 0; transform: translateY(-40vh) scale(0.3); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .slide-anim { animation: slideFromDeck 0.5s cubic-bezier(0.25, 1, 0.5, 1) both; }

        .bouncing-arrow {
            position: absolute; top: -45px; left: 0; width: 100%; text-align: center;
            font-size: 2.5rem; color: #eab308; display: none;
            animation: bounce 1s infinite; z-index: 20; pointer-events: none; text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
        }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        #direction-ring { position: absolute; width: 340px; height: 340px; z-index: 1; pointer-events: none; opacity: 0.2; }
        .spin-cw { animation: spin 12s linear infinite; } 
        .spin-ccw { animation: spinReverse 12s linear infinite; }
        .spin-ccw svg { transform: scaleX(-1); }
        @keyframes spin { 100% { transform: rotate(360deg); } } 
        @keyframes spinReverse { 100% { transform: rotate(-360deg); } }

        .stack-bubble {
            position: absolute; top: -15px; right: -15px; background: #ef4444; color: white;
            font-size: 1.2rem; font-weight: 800; width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 2px solid white; z-index: 25;
        }

        .action-bar { display: flex; gap: 1rem; margin-bottom: 1rem; min-height: 45px; }
        .uno-btn { padding: 0.8rem 1.5rem; font-size: 1rem; font-weight: 800; border-radius: 50px; border: 2px solid white; cursor: pointer; color: white; transition: all 0.2s;}
        
        #call-uno-btn { background-color: transparent; border-color: #eab308; color: #eab308; display: none; }
        #call-uno-btn.active { background-color: #eab308; color: white; cursor: default; pointer-events: none; }
        #catch-btn { background-color: #ef4444; border-color: #ef4444; display: none; }
        #catch-btn:hover { background-color: #dc2626; transform: scale(1.05); }
        #pass-btn { background-color: #3b82f6; border-color: #3b82f6; display: none; }
        #start-game-btn { background-color: #10b981; border-color: #10b981; font-size: 1.5rem; padding: 1rem 3rem; }
        #start-game-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #color-modal, #end-game-modal, #pause-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; flex-direction: column; }
        .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        .color-btn { width: 100px; height: 100px; border-radius: 8px; border: 2px solid white; cursor: pointer; }
        .color-btn:hover { transform: scale(1.05); }
        
        #end-game-modal { z-index: 200; }
        #pause-modal { z-index: 300; }

        #room-chat-container {
            position: fixed; top: 1rem; right: 1rem; width: 300px; height: 350px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); border-radius: 12px;
            display: flex; flex-direction: column; z-index: 60; backdrop-filter: blur(10px);
        }
        #room-chat-messages {
            flex: 1; padding: 10px; overflow-y: auto; font-size: 0.9rem;
            display: flex; flex-direction: column; gap: 5px;
        }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; word-wrap: break-word; }
        .chat-msg b { color: var(--accent); }
        #room-chat-input {
            background: transparent; border: none; border-top: 1px solid var(--card-border);
            color: white; padding: 12px; font-size: 0.9rem; font-family: 'Inter', sans-serif; outline: none;
        }
    </style>
</head>
<body>

    <div id="pregame-lobby">
        <h2 style="font-size: 2.5rem; margin-bottom: 0;">UNO</h2>
        <h1 style="color: var(--accent); font-size: 4rem; margin-top: 0; letter-spacing: 5px;" id="lobby-code-display"></h1>
        
        <div style="display: flex; gap: 2rem; align-items: flex-start; margin-top: 1rem;">
            <div class="player-list-box">
                <h3 style="margin-top: 0; border-bottom: 1px solid var(--card-border); padding-bottom: 10px;" id="lobby-count-text">Players (1/4)</h3>
                <div id="lobby-players-list"></div>
            </div>

            <div class="settings-panel" id="host-settings-panel" style="display: none;">
                <h3 style="margin-top: 0; border-bottom: 1px solid var(--card-border); padding-bottom: 10px;">House Rules</h3>
                <label><input type="checkbox" id="rule-playDrawn" checked onchange="pushRules()"> Play Drawn Card</label>
                <label><input type="checkbox" id="rule-drawUntilPlay" onchange="pushRules()"> Draw 'Til You Play</label>
                <label><input type="checkbox" id="rule-stacking" onchange="pushRules()"> +2 / +4 Stacking</label>
                <label><input type="checkbox" id="rule-jumpIn" onchange="pushRules()"> Jump-In (Exact Match)</label>
                <label><input type="checkbox" id="rule-zeroPass" onchange="pushRules()"> 0-Card Rotates Hands</label>
            </div>
            
            <div class="settings-panel" id="guest-rules-panel" style="display: none;">
                <h3 style="margin-top: 0; border-bottom: 1px solid var(--card-border); padding-bottom: 10px;">Active Rules</h3>
                <div id="active-rules-list" style="color: var(--text-muted);">Standard</div>
            </div>
        </div>

        <button id="start-game-btn" class="uno-btn" style="display: none;" onclick="startPrivateGame()">Start Game</button>
        <p id="guest-wait-text" style="color: var(--text-muted); font-size: 1.2rem; display: none;">Waiting for the Host to start the match...</p>

        <button class="uno-btn" style="margin-top: 2rem; background: transparent; border-color: var(--card-border);" onclick="window.location.href='../index.html'">Leave Room</button>
    </div>

    <div id="game-header" style="display: none;">
        <h2 style="margin:0;">Uno</h2>
        <div id="status-display">Connecting...</div>
    </div>

    <div class="arena" id="arena-view">
        <div class="pos-top" id="slot-top"></div>
        <div class="pos-left" id="slot-left"></div>
        <div class="pos-right" id="slot-right"></div>

        <div class="pos-center">
            <div id="direction-ring" class="spin-cw">
                <svg viewBox="0 0 200 200" style="width: 100%; height: 100%;">
                    <defs>
                        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                          <path d="M 0 1 L 8 5 L 0 9 z" fill="#fff" />
                        </marker>
                    </defs>
                    <path d="M 100 10 A 90 90 0 0 1 190 100" fill="none" stroke="#fff" stroke-width="4" marker-end="url(#arrow)" />
                    <path d="M 190 100 A 90 90 0 0 1 100 190" fill="none" stroke="#fff" stroke-width="4" marker-end="url(#arrow)" />
                    <path d="M 100 190 A 90 90 0 0 1 10 100" fill="none" stroke="#fff" stroke-width="4" marker-end="url(#arrow)" />
                    <path d="M 10 100 A 90 90 0 0 1 100 10" fill="none" stroke="#fff" stroke-width="4" marker-end="url(#arrow)" />
                </svg>
            </div>

            <div id="turn-timer">15s</div>
            <div class="card-cluster">
                <div id="draw-deck" class="uno-card bg-deck" onclick="drawCard()">
                    <div id="draw-arrow" class="bouncing-arrow">⬇</div>
                    DRAW
                    <div id="stack-bubble" class="stack-bubble" style="display: none;"></div>
                </div>
                <div id="discard-pile" class="uno-card bg-red"></div>
            </div>
        </div>

        <div class="pos-bottom">
            <div class="action-bar">
                <button id="call-uno-btn" class="uno-btn" onclick="toggleUno()">Call UNO!</button>
                <button id="catch-btn" class="uno-btn" onclick="catchUno()">Catch!</button>
                <button id="pass-btn" class="uno-btn" onclick="passTurn()">End Turn</button>
            </div>
            <div id="my-card-count" style="margin-bottom: 5px; color: var(--text-muted); font-weight: 600; font-size: 1.1rem;"></div>
            <div id="my-hand" style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;"></div>
        </div>
    </div>

    <div id="color-modal">
        <div style="background: var(--bg-gradient); padding: 2rem; border-radius: 16px; text-align: center;">
            <h3>Choose a Color</h3>
            <div class="color-grid">
                <button class="color-btn bg-red" onclick="selectColor('red')"></button>
                <button class="color-btn bg-blue" onclick="selectColor('blue')"></button>
                <button class="color-btn bg-green" onclick="selectColor('green')"></button>
                <button class="color-btn bg-yellow" onclick="selectColor('yellow')"></button>
            </div>
        </div>
    </div>

    <div id="end-game-modal">
        <h1 id="end-game-title" style="font-size: 4rem; margin-top: 0; margin-bottom: 1rem; text-shadow: 0 4px 6px rgba(0,0,0,0.5);"></h1>
        <p id="end-game-subtitle" style="font-size: 1.5rem; color: var(--text-muted); margin-bottom: 2rem;"></p>
        <div style="display: flex; gap: 1rem;">
            <button id="modal-rematch-btn" class="uno-btn" style="background-color: #10b981; border-color: #10b981; font-size: 1.5rem; padding: 1rem 2rem;" onclick="requestRematch()">Request Rematch</button>
            <button class="uno-btn" style="background-color: transparent; border-color: var(--card-border); font-size: 1.5rem; padding: 1rem 2rem;" onclick="window.location.href='../index.html'">Leave Room</button>
        </div>
    </div>

    <div id="pause-modal">
        <h1 style="color: #ef4444; font-size: 3rem; margin: 0;">Game Paused</h1>
        <p id="pause-text" style="color: var(--text-main); font-size: 1.5rem;"></p>
        <button id="vote-restart-btn" class="uno-btn" style="background-color: #3b82f6; border-color: #3b82f6; margin-top: 1rem;" onclick="voteRestart()">Vote to Restart Lobby</button>
    </div>

    <div id="room-chat-container">
        <div id="room-chat-messages"></div>
        <input type="text" id="room-chat-input" placeholder="Type a message..." autocomplete="off" />
    </div>

    <script>
        const socket = io();
        const statusDisplay = document.getElementById('status-display');
        const discardPile = document.getElementById('discard-pile');
        const drawDeck = document.getElementById('draw-deck');
        const stackBubble = document.getElementById('stack-bubble');
        const myHandContainer = document.getElementById('my-hand');
        const myCardCount = document.getElementById('my-card-count');
        const colorModal = document.getElementById('color-modal');
        const endGameModal = document.getElementById('end-game-modal');
        const endGameTitle = document.getElementById('end-game-title');
        const endGameSubtitle = document.getElementById('end-game-subtitle');
        const modalRematchBtn = document.getElementById('modal-rematch-btn');
        const pauseModal = document.getElementById('pause-modal');
        const pauseText = document.getElementById('pause-text');
        const voteRestartBtn = document.getElementById('vote-restart-btn');
        const callUnoBtn = document.getElementById('call-uno-btn');
        const catchBtn = document.getElementById('catch-btn');
        const passBtn = document.getElementById('pass-btn');
        const dirRing = document.getElementById('direction-ring');
        const timerDisplay = document.getElementById('turn-timer');
        const chatInput = document.getElementById('room-chat-input');
        const chatMessages = document.getElementById('room-chat-messages');
        
        const sounds = {
            play: new Audio('/sounds/play.mp3'),
            draw: new Audio('/sounds/draw.mp3'),
            turn: new Audio('/sounds/turn.mp3'),
            uno: new Audio('/sounds/uno.mp3'),
            win: new Audio('/sounds/win.mp3')
        };

        function playSound(type) {
            if (sounds[type]) {
                sounds[type].currentTime = 0; 
                sounds[type].play().catch(err => {});
            }
        }

        let playerNames = {}; 
        let mySymbol = '';
        let gameActive = false;
        let pendingWildCardIndex = null; 
        let wasMyTurn = false; 
        
        let turnTimerInterval;
        let timeLeft = 15;
        let previousHandCount = 0; 
        let isLobbyHost = false;

        let mySessionId = localStorage.getItem('nexusSessionId');
        if (!mySessionId) {
            mySessionId = Math.random().toString(36).substring(2, 15);
            localStorage.setItem('nexusSessionId', mySessionId);
        }

        const myUsername = localStorage.getItem('nexusUsername') || 'Guest';
        const urlParams = new URLSearchParams(window.location.search);
        
        socket.emit('joinGame', { 
            type: 'uno', 
            username: myUsername, 
            private: urlParams.get('private') === 'true', 
            roomCode: urlParams.get('room'),
            sessionId: mySessionId
        });

        socket.on('lobbyUpdate', (data) => {
            document.getElementById('pregame-lobby').style.display = 'flex';
            document.getElementById('arena-view').style.display = 'none';
            document.getElementById('game-header').style.display = 'none';
            endGameModal.style.display = 'none';
            pauseModal.style.display = 'none';
            gameActive = false;
            if(turnTimerInterval) clearInterval(turnTimerInterval);
            
            document.getElementById('lobby-code-display').innerText = data.code ? `Room Code: ${data.code}` : "Public Room";
            document.getElementById('lobby-count-text').innerText = `Players (${data.players.length}/${data.maxPlayers})`;
            
            const listEl = document.getElementById('lobby-players-list');
            listEl.innerHTML = '';
            
            data.players.forEach(p => {
                const isHost = p.id === data.hostId;
                listEl.innerHTML += `<div class="lobby-player-row">${isHost ? 'Host' : 'Player'} | <b>${p.name}</b></div>`;
            });

            isLobbyHost = (socket.id === data.hostId);
            const startBtn = document.getElementById('start-game-btn');
            const waitText = document.getElementById('guest-wait-text');

            if (isLobbyHost) {
                startBtn.style.display = 'inline-block';
                waitText.style.display = 'none';
                startBtn.disabled = data.players.length < 2; 
                startBtn.innerText = data.players.length < 2 ? "Waiting for players..." : "Start Game";
                document.getElementById('host-settings-panel').style.display = 'block';
                document.getElementById('guest-rules-panel').style.display = 'none';
            } else {
                startBtn.style.display = 'none';
                waitText.style.display = 'block';
                document.getElementById('host-settings-panel').style.display = 'none';
                document.getElementById('guest-rules-panel').style.display = 'block';
            }
            
            updateGuestRulesText(data.rules);
        });

        function pushRules() {
            if (!isLobbyHost) return;
            const rules = {
                playDrawn: document.getElementById('rule-playDrawn').checked,
                drawUntilPlay: document.getElementById('rule-drawUntilPlay').checked,
                stacking: document.getElementById('rule-stacking').checked,
                jumpIn: document.getElementById('rule-jumpIn').checked,
                zeroPass: document.getElementById('rule-zeroPass').checked
            };
            socket.emit('updateRules', rules);
        }

        socket.on('rulesUpdated', (rules) => { updateGuestRulesText(rules); });

        function updateGuestRulesText(rules) {
            let active = [];
            if (rules.playDrawn) active.push("Play Drawn Card");
            if (rules.drawUntilPlay) active.push("Draw 'Til You Play");
            if (rules.stacking) active.push("Stacking");
            if (rules.jumpIn) active.push("Jump-In");
            if (rules.zeroPass) active.push("0-Card Rotation");
            document.getElementById('active-rules-list').innerText = active.length > 0 ? active.join(' • ') : "Standard Rules";
        }

        function startPrivateGame() { socket.emit('hostStartGame'); }

        socket.on('waitingForOpponent', (code) => {
            document.getElementById('game-header').style.display = 'block';
            statusDisplay.innerHTML = "Waiting for random opponent...";
            gameActive = false;
        });

        socket.on('secretGameStart', (data) => {
            document.getElementById('pregame-lobby').style.display = 'none';
            endGameModal.style.display = 'none';
            pauseModal.style.display = 'none';
            document.getElementById('arena-view').style.display = 'grid';
            document.getElementById('game-header').style.display = 'block';

            playerNames = data.names; 
            gameActive = true;
            updateUI(data.state);
        });

        socket.on('updateSecretBoard', (state) => { updateUI(state); });

        socket.on('gameOver', (data) => {
            playSound('win');
            gameActive = false; clearInterval(turnTimerInterval);
            statusDisplay.innerHTML = "Game Over";
            
            const isMe = playerNames[data.winner] === playerNames[mySymbol];
            endGameTitle.innerText = isMe ? "You Won!" : `${playerNames[data.winner]} Won!`;
            endGameTitle.style.color = isMe ? "#10b981" : "#eab308";
            endGameSubtitle.innerText = "Do you want to play another round?";
            
            modalRematchBtn.style.display = 'inline-block';
            modalRematchBtn.innerText = "Request Rematch";
            modalRematchBtn.disabled = false;
            pauseModal.style.display = 'none';
            endGameModal.style.display = 'flex';
        });

        socket.on('rematchUpdate', (data) => {
            if (modalRematchBtn) {
                if (modalRematchBtn.disabled) {
                    modalRematchBtn.innerText = `Waiting for others... (${data.current}/${data.total})`;
                } else {
                    modalRematchBtn.innerText = `Accept Rematch (${data.current}/${data.total})`;
                }
            }
        });

        socket.on('rematchProposed', () => {
            if(modalRematchBtn && !modalRematchBtn.disabled) modalRematchBtn.innerText = "Rematch Proposed! Accept?";
        });

        socket.on('playerCalledUno', () => {
            playSound('uno');
            const originalText = statusDisplay.innerHTML;
            statusDisplay.innerHTML = `<span style="color: #eab308; font-size: 1.5rem; font-weight: bold;">📢 UNO called!</span>`;
            setTimeout(() => { if(gameActive) statusDisplay.innerHTML = originalText; }, 1500); 
        });

        socket.on('playerDisconnectWarning', (name) => {
            pauseText.innerText = `${name} disconnected! Waiting for reconnect (20s)...`;
            voteRestartBtn.innerText = "Vote to Restart Lobby";
            voteRestartBtn.disabled = false;
            pauseModal.style.display = 'flex';
        });

        socket.on('playerReconnected', (name) => {
            pauseModal.style.display = 'none';
            voteRestartBtn.disabled = false;
            voteRestartBtn.innerText = "Vote to Restart Lobby";
            const originalText = statusDisplay.innerHTML;
            statusDisplay.innerHTML = `<span style="color: #10b981; font-weight: bold;">✅ ${name} reconnected!</span>`;
            setTimeout(() => { if(gameActive) statusDisplay.innerHTML = originalText; }, 2000); 
        });

        socket.on('restartVoteUpdate', (data) => {
            if (voteRestartBtn) {
                if (voteRestartBtn.disabled) {
                    voteRestartBtn.innerText = `Waiting for others... (${data.current}/${data.total})`;
                } else {
                    voteRestartBtn.innerText = `Vote to Restart Lobby (${data.current}/${data.total})`;
                }
            }
        });

        function requestRematch() {
            socket.emit('requestRematch');
            if(modalRematchBtn) { modalRematchBtn.innerText = "Voting..."; modalRematchBtn.disabled = true; }
        }

        function voteRestart() {
            socket.emit('voteRestartLobby');
            if (voteRestartBtn) { voteRestartBtn.innerText = "Voting..."; voteRestartBtn.disabled = true; }
        }

        function toggleUno() { playSound('uno'); socket.emit('makeMove', { action: 'call_uno' }); }
        
        function catchUno() { if (gameActive) socket.emit('makeMove', { action: 'catch' }); }
        
        function drawCard() { 
            if (gameActive) { socket.emit('makeMove', { action: 'draw' }); }
        }
        
        function passTurn() { 
            if (gameActive) socket.emit('makeMove', { action: 'pass' }); 
        }

        function getCardDisplayValue(v) {
            if (v === 'skip') return 'Skip'; if (v === 'reverse') return 'Rev';
            if (v === 'draw2') return '+2'; if (v === 'wild') return 'Wild';
            if (v === 'wild4') return '+4'; return v;
        }

        function canPlay(card, topCard) {
            if (card.color === 'wild') return true;
            const activeColor = topCard.chosenColor || topCard.color;
            return card.color === activeColor || card.value === topCard.value;
        }
        function canJumpIn(card, topCard) {
            return card.color !== 'wild' && card.color === topCard.color && card.value === topCard.value;
        }

        function startTimer() {
            clearInterval(turnTimerInterval);
            timeLeft = 15; timerDisplay.innerText = `${timeLeft}s`;
            turnTimerInterval = setInterval(() => {
                timeLeft--; timerDisplay.innerText = `${timeLeft}s`;
                if (timeLeft <= 0) { clearInterval(turnTimerInterval); timerDisplay.innerText = "Time's up!"; }
            }, 1000);
        }

        function updateUI(state) {
            mySymbol = state.mySymbol;
            startTimer(); 
            const isMyTurn = state.currentTurn === mySymbol;
            
            if (isMyTurn && !wasMyTurn) playSound('turn');
            wasMyTurn = isMyTurn;

            dirRing.setAttribute('class', state.direction === 1 ? 'spin-cw' : 'spin-ccw');
            
            passBtn.style.display = (isMyTurn && state.hasDrawn) ? 'inline-block' : 'none';
            
            let anyoneVulnerable = false;
            for (const opp in state.opponentCards) {
                if (state.opponentCards[opp] === 1 && !state.safePlayers[opp]) anyoneVulnerable = true;
            }
            catchBtn.style.display = anyoneVulnerable ? 'inline-block' : 'none';
            
            const isMyTurnText = isMyTurn ? "<b style='color: white;'> (Your Turn!)</b>" : "";
            const dirText = state.direction === 1 ? 'Clockwise' : 'Counter-Clockwise';
            
            statusDisplay.innerHTML = `
                <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;">Direction: ${dirText}</div>
                Playing as: <b>${playerNames[mySymbol]}</b><br><br>
                <span style="color: var(--accent);">${playerNames[state.currentTurn]}</span> is thinking... ${isMyTurnText}
            `;

            if (state.stackPenalty > 0) {
                stackBubble.innerText = `+${state.stackPenalty}`;
                stackBubble.style.display = 'flex';
                statusDisplay.innerHTML += `<div style="color: #ef4444; font-weight: bold; animation: pulse 0.5s infinite;">⚠️ STACK INCOMING! Play a + card or Draw!</div>`;
            } else {
                stackBubble.style.display = 'none';
            }

            const displayColor = state.topCard.color === 'wild' ? state.topCard.chosenColor : state.topCard.color;
            discardPile.className = `uno-card bg-${displayColor}`;
            discardPile.innerText = getCardDisplayValue(state.topCard.value);
            
            drawDeck.classList.toggle('disabled-card', !isMyTurn || state.hasDrawn);

            myCardCount.innerText = `Your Hand: ${state.myHand.length} Cards`;
            myHandContainer.innerHTML = '';
            
            const isDrawing = state.myHand.length > previousHandCount;
            let hasPlayableCard = false; 
            
            state.myHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = `uno-card bg-${card.color}`;
                cardEl.innerText = getCardDisplayValue(card.value);

                if (isDrawing && index >= previousHandCount) {
                    cardEl.classList.add('slide-anim');
                    const delay = (index - previousHandCount) * 0.15;
                    cardEl.style.animationDelay = `${delay}s`;
                    setTimeout(() => { if (gameActive) playSound('draw'); }, delay * 1000);
                }
                
                let cardIsPlayable = false;
                if (isMyTurn) {
                    if (state.stackPenalty > 0) {
                        cardIsPlayable = (card.value === 'draw2' || card.value === 'wild4');
                    } else {
                        cardIsPlayable = canPlay(card, state.topCard);
                    }
                } else if (state.rules.jumpIn && state.stackPenalty === 0) {
                    cardIsPlayable = canJumpIn(card, state.topCard);
                }
                
                if (!cardIsPlayable) {
                    cardEl.classList.add('disabled-card');
                } else {
                    if (isMyTurn) hasPlayableCard = true; 
                    cardEl.onclick = () => {
                        if (!gameActive) return;
                        if (card.color === 'wild') {
                            pendingWildCardIndex = index; colorModal.style.display = 'flex'; 
                        } else {
                            playSound('play');
                            socket.emit('makeMove', { action: 'play', cardIndex: index });
                        }
                    };
                }
                myHandContainer.appendChild(cardEl);
            });
            previousHandCount = state.myHand.length;

            const canReachOneCard = (state.myHand.length === 2 && hasPlayableCard) || state.myHand.length === 1;
            
            if (state.unoSafe) { 
                callUnoBtn.classList.add('active'); 
                callUnoBtn.innerText = "UNO! (Safe)"; 
            } else { 
                callUnoBtn.classList.remove('active'); 
                callUnoBtn.innerText = "Call UNO!"; 
            }
            
            callUnoBtn.style.display = (isMyTurn && canReachOneCard) ? 'inline-block' : 'none';

            const drawArrow = document.getElementById('draw-arrow');
            if (isMyTurn && !hasPlayableCard && !state.hasDrawn) drawArrow.style.display = 'block';
            else drawArrow.style.display = 'none';

            const order = state.playerOrder;
            const myIndex = order.indexOf(mySymbol);
            const leftIndex = (myIndex + 1) % order.length;
            const topIndex = (myIndex + 2) % order.length;
            const rightIndex = (myIndex + 3) % order.length;

            function renderOpp(slotId, oppSymbol) {
                const slot = document.getElementById(slotId);
                slot.innerHTML = ''; 
                if (!oppSymbol || oppSymbol === mySymbol) return; 
                
                const count = state.opponentCards[oppSymbol];
                const isActive = state.currentTurn === oppSymbol ? 'active-turn' : '';
                
                let warning = '';
                if (count === 1) {
                    if (state.safePlayers[oppSymbol]) warning = '<div style="color:#10b981; font-size:0.8rem; font-weight:bold;">UNO! (Safe)</div>';
                    else warning = '<div style="color:#ef4444; font-size:0.8rem; font-weight:bold; animation:pulse 1s infinite;">1 CARD!</div>';
                }
                
                slot.innerHTML = `
                    <div class="opp-plate ${isActive}">
                        <div>${playerNames[oppSymbol]}</div>
                        <div class="opp-cards">Cards: ${count}</div>
                        ${warning}
                    </div>
                `;
            }

            if (order.length === 2) {
                renderOpp('slot-top', order[leftIndex]); renderOpp('slot-left', null); renderOpp('slot-right', null);
            } else if (order.length === 3) {
                renderOpp('slot-left', order[leftIndex]); renderOpp('slot-right', order[topIndex]); renderOpp('slot-top', null);
            } else {
                renderOpp('slot-left', order[leftIndex]); renderOpp('slot-top', order[topIndex]); renderOpp('slot-right', order[rightIndex]);
            }
        }

        function selectColor(color) {
            playSound('play'); colorModal.style.display = 'none';
            socket.emit('makeMove', { action: 'play', cardIndex: pendingWildCardIndex, declaredColor: color });
        }

        socket.on('opponentLeft', () => {
            gameActive = false;
            clearInterval(turnTimerInterval);
            endGameTitle.innerText = "Opponent Disconnected";
            endGameTitle.style.color = "#ef4444";
            endGameSubtitle.innerText = "Someone has abandoned the match.";
            modalRematchBtn.style.display = 'none';
            pauseModal.style.display = 'none';
            endGameModal.style.display = 'flex';
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && chatInput.value.trim() !== '') {
                socket.emit('sendRoomChat', chatInput.value.trim());
                chatInput.value = '';
            }
        });

        socket.on('roomChatMessage', (data) => {
            const msgEl = document.createElement('div');
            msgEl.className = 'chat-msg';
            msgEl.innerHTML = `<b>${data.user}:</b> ${data.text}`;
            chatMessages.appendChild(msgEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
</body>
</html>
