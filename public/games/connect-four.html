<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four | Tabletop Nexus</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --c4-red: #ef4444;
            --c4-yellow: #eab308;
            --c4-board-bg: #1e3a8a;
            --c4-hole-bg: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 2rem auto;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        h2 { font-size: 2.5rem; margin-bottom: 2rem; font-weight: 800; }

        #game-board-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px dashed var(--card-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            backdrop-filter: blur(5px);
            padding: 3rem 0;
        }

        #status-display {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            min-height: 3rem;
        }

        .c4-board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            background: var(--c4-board-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .c4-cell {
            width: 60px;
            height: 60px;
            background-color: var(--c4-hole-bg);
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.4);
        }

        .c4-cell:hover { transform: scale(0.95); }
        .c4-cell.red { background-color: var(--c4-red); box-shadow: inset 0 -4px 6px rgba(0,0,0,0.3), 0 0 8px var(--c4-red); }
        .c4-cell.yellow { background-color: var(--c4-yellow); box-shadow: inset 0 -4px 6px rgba(0,0,0,0.3), 0 0 8px var(--c4-yellow); }

        .button-group { display: flex; gap: 1rem; justify-content: center; }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover { background-color: var(--accent-hover); transform: translateY(-2px); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Connect Four</h2>
        
        <div id="game-board-container">
            <div id="status-display">Connecting to server...</div>
            <div class="c4-board" id="c4-board"></div>
        </div>

        <div class="button-group">
            <button onclick="window.location.href='../index.html'">
                Return to Lobby
            </button>
        </div>
    </div>

    <script>
    const socket = io();
    const statusDisplay = document.getElementById('status-display');
    const c4BoardEl = document.getElementById('c4-board');
    
    let mySymbol = 0; 
    let playerNames = {}; 
    let gameActive = false;

    const myUsername = localStorage.getItem('nexusUsername') || 'Guest';

    for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 7; c++) {
            const cell = document.createElement('div');
            cell.className = 'c4-cell';
            cell.dataset.row = r;
            cell.dataset.col = c;
            
            cell.addEventListener('click', (e) => {
                if (!gameActive) return;
                const col = parseInt(e.target.dataset.col);
                socket.emit('makeMove', col);
            });
            
            c4BoardEl.appendChild(cell);
        }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const isPrivate = urlParams.get('private') === 'true';
    const joinCode = urlParams.get('room');

    socket.emit('joinGame', { 
        type: 'c4', 
        username: myUsername, 
        private: isPrivate, 
        roomCode: joinCode 
    });

    socket.on('waitingForOpponent', (code) => {
        if (code) {
            statusDisplay.innerHTML = `🔒 Private Room Created!<br>Share this code with your friend: <br><b style="color:var(--accent); font-size:2.5rem; letter-spacing:4px;">${code}</b><br><br>⏳ Waiting for them to join...`;
        } else {
            statusDisplay.innerHTML = "⏳ Waiting for a random opponent to join...";
        }
        gameActive = false;
    });

    socket.on('gameStart', (data) => {
        mySymbol = data.symbols[socket.id];
        playerNames = data.names; 
        gameActive = true;
        updateUI(data.board, data.turn);
    });

    socket.on('updateBoard', (data) => {
        updateUI(data.board, data.turn);
    });

    socket.on('gameOver', (data) => {
        drawBoard(data.board);
        gameActive = false;
        
        let message = "";
        if (data.winner === 'Draw') {
            message = `🤝 Game ended in a Draw!`;
        } else {
            const color = data.winner === 1 ? 'var(--c4-red)' : 'var(--c4-yellow)';
            const winnerName = data.names[data.winner]; 
            const youWon = data.winner === mySymbol ? "🏆 You won!" : "💀 You lost!";
            message = `<h3><span style="color: ${color}">${winnerName}</span> wins!</h3>${youWon}`;
        }

        statusDisplay.innerHTML = `
            ${message}<br><br>
            <div class="button-group">
                <button id="rematch-btn" onclick="requestRematch()">Request Rematch</button>
            </div>
        `;
    });

    socket.on('rematchProposed', () => {
        const btn = document.getElementById('rematch-btn');
        if (btn) {
            btn.innerText = "Opponent wants a rematch! Accept?";
            btn.style.backgroundColor = "#10b981"; 
        }
    });

    function requestRematch() {
        socket.emit('requestRematch');
        const btn = document.getElementById('rematch-btn');
        btn.innerText = "Waiting for opponent...";
        btn.disabled = true;
        btn.style.opacity = "0.7";
    }

    socket.on('opponentLeft', () => {
        gameActive = false;
        statusDisplay.innerHTML = `🔴 Your opponent left the room.<br><br><button onclick="window.location.href='../index.html'">Return to Lobby</button>`;
    });

    function updateUI(board, turn) {
        drawBoard(board);
        const turnColorVar = turn === 1 ? 'var(--c4-red)' : 'var(--c4-yellow)';
        const currentTurnName = playerNames[turn];
        const isMyTurnText = turn === mySymbol ? "<b>(Your Turn)</b>" : "";
        
        const opponentSymbol = mySymbol === 1 ? 2 : 1;
        const opponentName = playerNames[opponentSymbol] || "Opponent";
        const myColorName = mySymbol === 1 ? 'Red' : 'Yellow';
        
        statusDisplay.innerHTML = `
            <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;">
                You (${myColorName}) vs ${opponentName}
            </div>
            <span style="color: ${turnColorVar}">${currentTurnName}</span>'s turn. ${isMyTurnText}
        `;
    }

    function drawBoard(board) {
        for (let r = 0; r < 6; r++) {
            for (let c = 0; c < 7; c++) {
                const cellEl = document.querySelector(`.c4-cell[data-row="${r}"][data-col="${c}"]`);
                cellEl.className = 'c4-cell'; 
                
                if (board[r][c] === 1) cellEl.classList.add('red');
                if (board[r][c] === 2) cellEl.classList.add('yellow');
            }
        }
    }
</script>
</body>
</html>
